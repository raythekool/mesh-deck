[project]
name = "mesh-deck"
version = "0.1.0"
description = "Hermes-style interactive TUI/CLI for exploring and communicating with Meshtastic devices"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2,<3",
    "meshtastic>=2.7.11",
    "pyserial>=3.5",
    "rich>=15.0.0",
    "textual>=8.2.8",
]

[project.scripts]
mesh-deck = "mesh_deck.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
