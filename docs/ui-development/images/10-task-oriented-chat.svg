<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">Mesh Deck: messaggi proposti</title><desc id="desc">Rail globale, elenco delle conversazioni contestuale e compositore con destinazione visibile.</desc><rect width="1000" height="560" rx="14" fill="#09131b"/><rect x="10" y="10" width="980" height="540" rx="10" fill="#101f29" stroke="#34545b"/><rect x="10" y="10" width="185" height="540" rx="10" fill="#0c1821"/><g font-family="sans-serif"><text x="27" y="47" fill="#91f3d0" font-size="20" font-weight="bold">mesh-deck</text><text x="34" y="122" fill="#d2e4e6" font-size="14">Panoramica</text><rect x="19" y="138" width="167" height="40" rx="7" fill="#17483f"/><text x="34" y="164" fill="#e3fff1" font-size="14">Messaggi</text><text x="34" y="210" fill="#d2e4e6" font-size="14">Nodi</text><text x="34" y="251" fill="#d2e4e6" font-size="14">Topologia</text><text x="34" y="292" fill="#d2e4e6" font-size="14">Attività</text><text x="34" y="333" fill="#d2e4e6" font-size="14">Impostazioni</text><text x="34" y="505" fill="#b4d6ce" font-size="13">Comandi  Ctrl+P</text><text x="215" y="49" fill="#f0f7f5" font-size="24" font-weight="bold">Messaggi</text><rect x="743" y="25" width="222" height="34" rx="17" fill="#16473f"/><circle cx="761" cy="42" r="5" fill="#83edb8"/><text x="774" y="47" fill="#e3fff1" font-size="12">Radio connessa · EU_868</text><rect x="210" y="73" width="245" height="454" rx="9" fill="#142630" stroke="#34545b"/><text x="226" y="105" fill="#f0f7f5" font-size="17">Conversazioni</text><rect x="226" y="120" width="213" height="34" rx="6" fill="#223943"/><text x="236" y="142" fill="#91aeb7" font-size="12">Cerca canale o contatto…</text><text x="226" y="185" fill="#91aeb7" font-size="11">CANALI</text><rect x="220" y="194" width="225" height="57" rx="7" fill="#1d5148"/><text x="236" y="218" fill="#e3fff1" font-size="14"># Primario</text><text x="236" y="239" fill="#acd6c7" font-size="11">Ultimo messaggio ricevuto</text><text x="236" y="283" fill="#d2e4e6" font-size="14"># Secondario</text><text x="226" y="327" fill="#91aeb7" font-size="11">MESSAGGI DIRETTI</text><text x="236" y="356" fill="#d2e4e6" font-size="14">Tutti i DM</text><rect x="467" y="73" width="498" height="454" rx="9" fill="#142630" stroke="#34545b"/><text x="483" y="104" fill="#f0f7f5" font-size="18"># Primario</text><text x="483" y="127" fill="#91aeb7" font-size="11">Canale selezionato · messaggi in arrivo</text><line x1="482" y1="144" x2="950" y2="144" stroke="#34545b"/><rect x="485" y="169" width="306" height="70" rx="8" fill="#213a45"/><text x="498" y="191" fill="#9dd8ca" font-size="11">Nodo remoto · ricevuto</text><text x="498" y="217" fill="#e5f0ef" font-size="13">Messaggio di esempio sulla mesh.</text><rect x="629" y="267" width="321" height="70" rx="8" fill="#205247"/><text x="643" y="290" fill="#b4f0d7" font-size="11">Tu · inviato</text><text x="643" y="316" fill="#e5f7ed" font-size="13">Risposta di esempio.</text><line x1="482" y1="431" x2="950" y2="431" stroke="#34545b"/><rect x="483" y="446" width="366" height="45" rx="7" fill="#203741" stroke="#42616a"/><text x="497" y="474" fill="#9ab2b9" font-size="13">Scrivi a # Primario…</text><rect x="857" y="446" width="93" height="45" rx="7" fill="#24745e"/><text x="881" y="474" fill="#e6fff0" font-size="13">Invia</text><text x="483" y="510" fill="#91aeb7" font-size="11">Destinazione esplicita prima della trasmissione</text></g></svg>
