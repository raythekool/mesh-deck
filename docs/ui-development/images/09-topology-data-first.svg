<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Topology data first proposal</title>
  <desc id="desc">A text first topology edge list with data quality indicators, and a graph that remains intentionally deferred until reports exist.</desc>
  <rect width="1200" height="700" fill="#081018"/>
  <text x="40" y="50" fill="#00f3ff" font-family="monospace" font-size="25" font-weight="bold">MESH TOPOLOGY: DATA FIRST, GRAPH LATER</text>
  <rect x="40" y="90" width="710" height="545" rx="10" fill="#0b1720" stroke="#1f8794"/>
  <text x="65" y="128" fill="#9fffd0" font-family="monospace" font-size="19" font-weight="bold">NEIGHBOR EDGES / FILTERABLE</text>
  <rect x="62" y="152" width="666" height="40" rx="6" fill="#10212b"/>
  <text x="82" y="178" fill="#9fffd0" font-family="monospace" font-size="16">Filter node, link quality, age...</text>
  <text x="72" y="226" fill="#94a3b8" font-family="monospace" font-size="14">REPORTER              NEIGHBOR              SNR       AGE</text>
  <rect x="62" y="242" width="666" height="50" fill="#063b46"/>
  <text x="78" y="274" fill="#e8f1f5" font-family="monospace" font-size="17">ZION / Router         TRIN / Tracker        +4.8 dB   2m</text>
  <text x="78" y="327" fill="#e8f1f5" font-family="monospace" font-size="17">ZION / Router         MRPH / Local          +2.1 dB   2m</text>
  <text x="78" y="380" fill="#e8f1f5" font-family="monospace" font-size="17">NIOB / Repeater       ZION / Router         -5.4 dB   6m</text>
  <rect x="62" y="470" width="666" height="105" rx="7" fill="#10212b"/>
  <text x="82" y="505" fill="#ffb800" font-family="monospace" font-size="16">DATA QUALITY</text>
  <text x="82" y="535" fill="#e8f1f5" font-family="monospace" font-size="15">3 reporter tables / newest 2m / NeighborInfo enabled</text>
  <text x="82" y="560" fill="#94a3b8" font-family="monospace" font-size="15">No report means unknown, not disconnected.</text>
  <rect x="790" y="90" width="370" height="545" rx="10" fill="#10212b" stroke="#334155" stroke-dasharray="8 8"/>
  <text x="825" y="130" fill="#94a3b8" font-family="monospace" font-size="19" font-weight="bold">GRAPH VIEW / DEFERRED</text>
  <circle cx="970" cy="270" r="44" fill="#063b46" stroke="#00f3ff" stroke-width="3"/>
  <text x="950" y="277" fill="#00f3ff" font-family="monospace" font-size="17">MRPH</text>
  <circle cx="865" cy="385" r="38" fill="#10212b" stroke="#ffb800" stroke-width="3"/>
  <text x="846" y="391" fill="#ffb800" font-family="monospace" font-size="16">ZION</text>
  <circle cx="1070" cy="410" r="38" fill="#10212b" stroke="#00ff66" stroke-width="3"/>
  <text x="1051" y="416" fill="#00ff66" font-family="monospace" font-size="16">TRIN</text>
  <line x1="940" y1="305" x2="892" y2="356" stroke="#00f3ff" stroke-width="3"/>
  <line x1="1002" y1="307" x2="1042" y2="377" stroke="#00f3ff" stroke-width="3"/>
  <line x1="903" y1="393" x2="1032" y2="401" stroke="#ffb800" stroke-width="2"/>
  <text x="820" y="535" fill="#94a3b8" font-family="monospace" font-size="15">Build only after real reports are</text>
  <text x="820" y="560" fill="#94a3b8" font-family="monospace" font-size="15">frequent enough to avoid an empty toy.</text>
</svg>
