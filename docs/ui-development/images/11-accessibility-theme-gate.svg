<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Accessibility and theme quality gate proposal</title>
  <desc id="desc">Four theme cards, visible focus states, redundant text and icon status signals, and screenshot test coverage.</desc>
  <rect width="1200" height="700" fill="#081018"/>
  <text x="40" y="50" fill="#00f3ff" font-family="monospace" font-size="25" font-weight="bold">ACCESSIBILITY + THEME QUALITY GATE</text>
  <rect x="45" y="90" width="245" height="145" rx="10" fill="#081018" stroke="#00f3ff" stroke-width="3"/>
  <text x="70" y="125" fill="#00f3ff" font-family="monospace" font-size="19" font-weight="bold">CYBERPUNK</text>
  <text x="70" y="160" fill="#00ff66" font-family="monospace" font-size="17">CONNECTED [OK]</text>
  <text x="70" y="195" fill="#ff3366" font-family="monospace" font-size="17">LOST [!]</text>
  <rect x="320" y="90" width="245" height="145" rx="10" fill="#1a1b26" stroke="#7aa2f7" stroke-width="3"/>
  <text x="345" y="125" fill="#7aa2f7" font-family="monospace" font-size="19" font-weight="bold">MIDNIGHT</text>
  <text x="345" y="160" fill="#9ece6a" font-family="monospace" font-size="17">CONNECTED [OK]</text>
  <text x="345" y="195" fill="#f7768e" font-family="monospace" font-size="17">LOST [!]</text>
  <rect x="595" y="90" width="245" height="145" rx="10" fill="#2e3440" stroke="#88c0d0" stroke-width="3"/>
  <text x="620" y="125" fill="#88c0d0" font-family="monospace" font-size="19" font-weight="bold">NORD</text>
  <text x="620" y="160" fill="#a3be8c" font-family="monospace" font-size="17">CONNECTED [OK]</text>
  <text x="620" y="195" fill="#ff9ba4" font-family="monospace" font-size="17">LOST [!]</text>
  <rect x="870" y="90" width="245" height="145" rx="10" fill="#14100e" stroke="#ffb454" stroke-width="3"/>
  <text x="895" y="125" fill="#ffb454" font-family="monospace" font-size="19" font-weight="bold">EMBER</text>
  <text x="895" y="160" fill="#b8cc52" font-family="monospace" font-size="17">CONNECTED [OK]</text>
  <text x="895" y="195" fill="#f07178" font-family="monospace" font-size="17">LOST [!]</text>
  <rect x="45" y="275" width="520" height="330" rx="10" fill="#0b1720" stroke="#1f8794"/>
  <text x="75" y="315" fill="#9fffd0" font-family="monospace" font-size="20" font-weight="bold">KEYBOARD FOCUS IS UNMISTAKABLE</text>
  <rect x="75" y="350" width="455" height="60" rx="6" fill="#063b46" stroke="#ffffff" stroke-width="4"/>
  <text x="98" y="387" fill="#e8f1f5" font-family="monospace" font-size="18">TRIN / TRACKER / +9.5 dB / 3m</text>
  <text x="75" y="450" fill="#e8f1f5" font-family="monospace" font-size="17">[!] LOST   never color-only</text>
  <text x="75" y="485" fill="#e8f1f5" font-family="monospace" font-size="17">[OK] CONNECTED   text + icon + color</text>
  <text x="75" y="540" fill="#94a3b8" font-family="monospace" font-size="15">Focus ring, selected row, and disabled actions all differ.</text>
  <rect x="600" y="275" width="515" height="330" rx="10" fill="#10212b" stroke="#00f3ff"/>
  <text x="630" y="315" fill="#9fffd0" font-family="monospace" font-size="20" font-weight="bold">RELEASE GATE</text>
  <text x="640" y="365" fill="#00ff66" font-family="monospace" font-size="18">[x] Contrast checks / 4 themes</text>
  <text x="640" y="410" fill="#00ff66" font-family="monospace" font-size="18">[x] Default screenshot matrix</text>
  <text x="640" y="455" fill="#00ff66" font-family="monospace" font-size="18">[x] Compact screenshot matrix</text>
  <text x="640" y="500" fill="#00ff66" font-family="monospace" font-size="18">[x] Focus + disabled state checks</text>
  <text x="640" y="555" fill="#94a3b8" font-family="monospace" font-size="15">A new palette cannot silently reduce legibility.</text>
</svg>
