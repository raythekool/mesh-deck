<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Direct message conversation proposal</title>
  <desc id="desc">Chat screen with direct messages grouped by sender and a compose field with an explicit recipient.</desc>
  <rect width="1200" height="700" fill="#081018"/>
  <rect x="25" y="20" width="1150" height="54" rx="10" fill="#10212b" stroke="#00f3ff"/>
  <text x="50" y="54" fill="#00f3ff" font-family="monospace" font-size="24" font-weight="bold">MESH-DECK / CHAT</text>
  <rect x="25" y="94" width="305" height="570" rx="10" fill="#10212b" stroke="#1f8794"/>
  <text x="52" y="129" fill="#9fffd0" font-family="monospace" font-size="19" font-weight="bold">CHANNELS</text>
  <text x="52" y="174" fill="#e8f1f5" font-family="monospace" font-size="18"># LongFast</text>
  <text x="52" y="214" fill="#e8f1f5" font-family="monospace" font-size="18"># Ops</text>
  <line x1="52" y1="238" x2="300" y2="238" stroke="#334155"/>
  <text x="52" y="274" fill="#9fffd0" font-family="monospace" font-size="19" font-weight="bold">DIRECT MESSAGES</text>
  <rect x="45" y="290" width="265" height="66" rx="6" fill="#063b46" stroke="#00f3ff"/>
  <text x="62" y="320" fill="#00ff66" font-family="monospace" font-size="18">TRIN  Trinity Recon</text>
  <text x="62" y="344" fill="#e8f1f5" font-family="monospace" font-size="15">Coordinate confirmed</text>
  <rect x="275" y="302" width="23" height="23" rx="11" fill="#ff3366"/>
  <text x="281" y="320" fill="#081018" font-family="monospace" font-size="14" font-weight="bold">2</text>
  <text x="62" y="398" fill="#e8f1f5" font-family="monospace" font-size="18">ZION  Relay Tower</text>
  <text x="62" y="422" fill="#94a3b8" font-family="monospace" font-size="15">Link quality report</text>
  <rect x="355" y="94" width="820" height="570" rx="10" fill="#0b1720" stroke="#00f3ff"/>
  <text x="385" y="130" fill="#00f3ff" font-family="monospace" font-size="21" font-weight="bold">DM / TRIN / Trinity Recon Scout</text>
  <text x="385" y="160" fill="#94a3b8" font-family="monospace" font-size="16">!62d927b8  |  direct route  |  last heard 3m</text>
  <rect x="390" y="205" width="480" height="70" rx="8" fill="#10212b"/>
  <text x="410" y="235" fill="#e8f1f5" font-family="monospace" font-size="17">TRIN  18:02</text>
  <text x="410" y="260" fill="#e8f1f5" font-family="monospace" font-size="16">Coordinates for the meeting point confirmed.</text>
  <rect x="625" y="300" width="500" height="70" rx="8" fill="#063b46"/>
  <text x="645" y="330" fill="#00ff66" font-family="monospace" font-size="17">YOU  18:03</text>
  <text x="645" y="355" fill="#e8f1f5" font-family="monospace" font-size="16">Received. I am moving to the relay.</text>
  <rect x="380" y="570" width="560" height="48" rx="7" fill="#10212b" stroke="#00f3ff"/>
  <text x="402" y="600" fill="#9fffd0" font-family="monospace" font-size="16">Reply to TRIN...</text>
  <rect x="960" y="570" width="155" height="48" rx="7" fill="#00ff66"/>
  <text x="998" y="600" fill="#081018" font-family="monospace" font-size="17" font-weight="bold">Send DM</text>
  <text x="385" y="650" fill="#94a3b8" font-family="monospace" font-size="15">Recipient stays visible at send time; broadcasts retain their channel composer.</text>
</svg>
